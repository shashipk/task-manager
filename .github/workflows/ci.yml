##############################################################
# GitHub Actions – CI Pipeline
# Runs on every push and PR targeting main
# Acts as a quality gate BEFORE merging / before Cloud Build deploys
##############################################################

name: CI – Tests & Build

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────
  # Backend: compile + test
  # ─────────────────────────────────────────────
  backend:
    name: Backend Tests (Java 17 / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: mvn test -B --no-transfer-progress

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/target/surefire-reports/

  # ─────────────────────────────────────────────
  # Frontend: install + test + build
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend Tests (Node 20 / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: "http://localhost:8080"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  # ─────────────────────────────────────────────
  # Docker build check (no push)
  # Validates Dockerfiles are valid
  # ─────────────────────────────────────────────
  docker-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image (no push)
        run: |
          docker build \
            --tag task-manager-backend:ci \
            ./backend

      - name: Build frontend Docker image (no push)
        run: |
          docker build \
            --build-arg VITE_API_URL=http://localhost:8080 \
            --tag task-manager-frontend:ci \
            ./frontend
