##############################################################
# Cloud Build CD Pipeline
# Triggered on push to main branch
#
# Substitution variables (set in Cloud Build Trigger UI):
#   _PROJECT_ID  – your GCP project ID
#   _REGION      – e.g. us-central1
#   _REPO        – Artifact Registry repo name, e.g. task-manager
##############################################################

substitutions:
  _PROJECT_ID: "tasks-manager-488713"
  _REGION: "us-central1"
  _REPO: "task-manager"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ─────────────────────────────────────────────
  # 0. Run backend unit + integration tests FIRST
  #    Fail fast: no build/push/deploy if tests fail
  # ─────────────────────────────────────────────
  - id: test-backend
    name: "maven:3.9-eclipse-temurin-17-alpine"
    entrypoint: mvn
    args:
      - test
      - -f
      - backend/pom.xml
      - -B
    waitFor: ["-"]

  # ─────────────────────────────────────────────
  # 1. Build & push backend Docker image
  # ─────────────────────────────────────────────
  - id: build-backend
    name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/backend:${SHORT_SHA}"
      - -t
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/backend:latest"
      - ./backend
    waitFor: ["test-backend"]

  - id: push-backend
    name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - --all-tags
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/backend"
    waitFor: ["build-backend"]

  # ─────────────────────────────────────────────
  # 2. Deploy backend to Cloud Run
  # ─────────────────────────────────────────────
  - id: deploy-backend
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - task-manager-backend
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/backend:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --set-env-vars=SPRING_PROFILES_ACTIVE=prod
    waitFor: ["push-backend"]

  # ─────────────────────────────────────────────
  # 3. Get the backend URL for frontend build-arg
  # ─────────────────────────────────────────────
  - id: get-backend-url
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: bash
    args:
      - -c
      - |
        BACKEND_URL=$(gcloud run services describe task-manager-backend \
          --region=${_REGION} \
          --format="value(status.url)")
        echo "Backend URL: $BACKEND_URL"
        echo "$BACKEND_URL" > /workspace/backend_url.txt
    waitFor: ["deploy-backend"]

  # ─────────────────────────────────────────────
  # 4. Build & push frontend Docker image
  #    Inject backend URL as build-arg
  # ─────────────────────────────────────────────
  - id: build-frontend
    name: "gcr.io/cloud-builders/docker"
    entrypoint: bash
    args:
      - -c
      - |
        BACKEND_URL=$(cat /workspace/backend_url.txt)
        docker build \
          --build-arg VITE_API_URL="$BACKEND_URL" \
          -t "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/frontend:${SHORT_SHA}" \
          -t "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/frontend:latest" \
          ./frontend
    waitFor: ["get-backend-url"]

  - id: push-frontend
    name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - --all-tags
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/frontend"
    waitFor: ["build-frontend"]

  # ─────────────────────────────────────────────
  # 5. Deploy frontend to Cloud Run
  # ─────────────────────────────────────────────
  - id: deploy-frontend
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - task-manager-frontend
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/frontend:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=80
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
    waitFor: ["push-frontend"]

images:
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/backend:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/frontend:${SHORT_SHA}"
